# PostgreSQL 18 para desarrollo local. Las credenciales salen de .env (copia de
# .env.example, ignorado por git); nunca se escriben en este archivo.
#
#   cp .env.example .env
#   docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ofertas_postulaciones}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos en /var/lib/postgresql/18/docker:
      # el volumen se monta en /var/lib/postgresql (con la ruta vieja .../data no arranca).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
