# Configuración del servicio. Ningún valor real vive aquí: las URLs y credenciales llegan
# por variables de entorno (en local desde .env, en Azure desde las variables de entorno del App Service).
server:
  port: ${PORT:8080}

spring:
  application:
    name: ofertas-postulaciones
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    # El esquema lo manejan las migraciones de Flyway; Hibernate solo valida que coincida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

# Cadena de solo envío a la cola notificaciones-eventos (ServiceBus--SendConnectionString en el
# Key Vault). Si está vacía, los eventos solo se escriben en el log.
servicebus:
  connection-string: ${SERVICEBUS_CONNECTION_STRING:}

# Pesos de la compatibilidad de una oferta con el perfil (ver CompatibilityCalculator). No
# tienen que sumar 100: el puntaje se normaliza con la suma.
matching:
  weights:
    skills: 40
    location: 20
    availability: 20
    experience: 20

# Huella SHA-1 del certificado de cliente de APIM (varias separadas por coma). Si está vacía no se
# valida el certificado, que es lo que pasa en local y en las pruebas.
apim:
  cert-thumbprint: ${APIM_CERT_THUMBPRINT:}

# Swagger UI muestra el contrato escrito a mano (docs/openapi.yaml, publicado en /openapi.yaml), no
# uno generado del código: el contrato es lo que se acordó con la web y la app. springdoc igual
# genera /v3/api-docs (sin eso no registra Swagger UI), pero la interfaz no lo usa.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml

management:
  endpoints:
    web:
      exposure:
        include: health

# Importación de ofertas reales desde JSearch (ver JobImportConfig y JSearchJobSource). Sin
# JSEARCH_API_KEY no se importa nada. La clave vive en el Key Vault (Ofertas--JSearchApiKey) y
# llega al App Service como variable de entorno; nunca se escribe aquí.
importer:
  run-on-startup: ${JOBS_IMPORT_ON_STARTUP:true}
  # Cada dos días a las 6 a. m., hora de Costa Rica. Las ofertas son del último mes, así que no
  # hace falta más seguido, y así 6 búsquedas gastan unas 90 consultas al mes de las 200 gratis.
  cron: ${JOBS_IMPORT_CRON:0 0 6 */2 * *}
  jsearch:
    api-key: ${JSEARCH_API_KEY:}
    # Con RapidAPI. Para OpenWeb Ninja directo: base-url https://api.openwebninja.com/jsearch,
    # key-header x-api-key y host-header vacío.
    base-url: ${JSEARCH_BASE_URL:https://jsearch.p.rapidapi.com}
    key-header: ${JSEARCH_KEY_HEADER:X-RapidAPI-Key}
    host-header: ${JSEARCH_HOST_HEADER:jsearch.p.rapidapi.com}
    country: cr
    date-posted: month
  # Cada búsqueda gasta una consulta por corrida. El sector se asigna aquí porque JSearch no lo trae.
  queries:
    - text: desarrollador junior en Costa Rica
      sector: Tecnología
    - text: soporte técnico en Costa Rica
      sector: Tecnología
    - text: servicio al cliente bilingüe en Costa Rica
      sector: Servicio al cliente
    - text: practicante en Costa Rica
      sector: Prácticas profesionales
    - text: asistente administrativo en Costa Rica
      sector: Administración
    - text: trabajo remoto desde Costa Rica
      sector: Tecnología
