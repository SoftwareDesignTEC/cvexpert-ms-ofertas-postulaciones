# Configuración del servicio. Ningún valor real vive aquí: las URLs y credenciales llegan
# por variables de entorno (en local desde .env, en Azure desde las variables de entorno del App Service).
server:
  port: ${PORT:8080}

spring:
  application:
    name: ofertas-postulaciones
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    # El esquema lo manejan las migraciones de Flyway; Hibernate solo valida que coincida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

# Cadena de solo envío a la cola notificaciones-eventos (ServiceBus--SendConnectionString en el
# Key Vault). Si está vacía, los eventos solo se escriben en el log.
servicebus:
  connection-string: ${SERVICEBUS_CONNECTION_STRING:}

# Pesos de la compatibilidad de una oferta con el perfil (ver CompatibilityCalculator). No
# tienen que sumar 100: el puntaje se normaliza con la suma.
matching:
  weights:
    skills: 40
    location: 20
    availability: 20
    experience: 20

# Huella SHA-1 del certificado de cliente de APIM (varias separadas por coma). Si está vacía no se
# valida el certificado, que es lo que pasa en local y en las pruebas.
apim:
  cert-thumbprint: ${APIM_CERT_THUMBPRINT:}

management:
  endpoints:
    web:
      exposure:
        include: health
